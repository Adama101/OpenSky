name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: OS Atlas product
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    defaults:
      run:
        working-directory: OS Atlas
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: OS Atlas/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"

      - name: Backend API tests (SQLite)
        run: |
          npm run backend:install
          npm run test:backend

      - name: Backend tests and migrations on Postgres + PostGIS
        run: |
          docker run -d --name pg -e POSTGRES_USER=osatlas -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=os_atlas_test -p 5432:5432 postgis/postgis:16-3.4
          for i in $(seq 1 30); do docker exec pg pg_isready -U osatlas && break; sleep 2; done
          DATABASE_URL=postgresql+psycopg://osatlas:ci@127.0.0.1:5432/os_atlas_test npm run test:backend
          DATABASE_URL=postgresql+psycopg://osatlas:ci@127.0.0.1:5432/os_atlas_test uv run --project backend alembic -c backend/alembic.ini upgrade head
          DATABASE_URL=postgresql+psycopg://osatlas:ci@127.0.0.1:5432/os_atlas_test uv run --project backend alembic -c backend/alembic.ini check

      - name: Edge CV and AI analyst tests
        run: |
          npm run edge:install
          npm run ai:install
          npm run test:edge
          npm run test:ai

      - name: Fleet gateway tests (MAVLink command and control)
        run: npm run test:fleet

      - name: Console tests
        run: npm run test:console

      - name: Compose stack definition (dev, all profiles)
        run: docker compose -f infra/compose.yaml --profile edge --profile ai --profile fleet-sim config --quiet

      - name: Production configuration (realm, overlay, exposure, no dev defaults)
        run: npm run check:prod

      - name: Production console build
        run: OS_ATLAS_HOST=atlas.example.ma npm run build:prod
